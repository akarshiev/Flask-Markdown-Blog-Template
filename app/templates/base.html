<!DOCTYPE html>
<html lang="en" prefix="og: https://ogp.me/ns#">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Primary SEO -------------------------------------------------- -->
    <title>{% block seo_title %}{{ site.name }} - {{ site.job_title }}{% endblock %}</title>
    <meta name="description"
          content="{% block seo_desc %}{{ site.seo_description }}{% endblock %}">
    <meta name="author"   content="{{ site.name }}">
    <meta name="robots"   content="index, follow, max-snippet:-1, max-image-preview:large">
    <meta name="keywords" content="{% block seo_keywords %}{{ site.seo_keywords }}{% endblock %}">
    <link rel="canonical" href="{{ site.domain }}{{ request.path }}">

    <!-- Open Graph ---------------------------------------------------- -->
    <meta property="og:type"        content="{% block og_type %}website{% endblock %}">
    <meta property="og:url"         content="{{ site.domain }}{{ request.path }}">
    <meta property="og:site_name"   content="{{ site.name }}">
    <meta property="og:title"       content="{% block og_title %}{{ site.name }} — {{ site.job_title }}{% endblock %}">
    <meta property="og:description" content="{% block og_desc %}{{ site.seo_description }}{% endblock %}">
    <meta property="og:image"       content="{{ site.domain }}/static/images/og-cover.png">
    <meta property="og:locale"      content="en_US">

    <!-- Twitter Card -------------------------------------------------- -->
    <meta name="twitter:card"        content="summary_large_image">
    <meta name="twitter:title"       content="{% block tw_title %}{{ site.name }}{% endblock %}">
    <meta name="twitter:description" content="{% block tw_desc %}{{ site.job_title }}{% endblock %}">
    <meta name="twitter:image"       content="{{ site.domain }}/static/images/og-cover.png">

    <!-- Site identity structured data (all pages) --------------------- -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": {{ site.name | tojson }},
      "url": {{ site.domain | tojson }},
      "author": {
        "@type": "Person",
        "name": {{ site.name | tojson }},
        "url": {{ site.domain | tojson }}
      }
    }
    </script>

    {% block extra_head %}{% endblock %}

    <!-- Styles -------------------------------------------------------- -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

{% block reading_progress %}{% endblock %}

<nav class="navbar" id="navbar">
    <div class="nav-pill">
        <a href="{{ url_for('public.index') }}"
           class="nav-item {% if active == 'home' %}active{% endif %}">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"/><path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
            <span>Home</span>
        </a>
        <a href="{{ url_for('public.blogs_list') }}"
           class="nav-item {% if active == 'blog' %}active{% endif %}">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
            <span>Blog</span>
        </a>
        <a href="{{ url_for('public.bookmarks') }}"
           class="nav-item {% if active == 'bookmarks' %}active{% endif %}">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2 2 0 0 1 2 2v15a1 1 0 0 1-1.496.868l-4.512-2.578a2 2 0 0 0-1.984 0l-4.512 2.578A1 1 0 0 1 5 20V5a2 2 0 0 1 2-2z"/></svg>
            <span>Bookmarks</span>
        </a>
        <a href="{{ url_for('public.building') }}"
           class="nav-item {% if active == 'building' %}active{% endif %}">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 12-9.373 9.373a1 1 0 0 1-3.001-3L12 9"/><path d="m18 15 4-4"/><path d="m21.5 11.5-1.914-1.914A2 2 0 0 1 19 8.172v-.344a2 2 0 0 0-.586-1.414l-1.657-1.657A6 6 0 0 0 12.516 3H9l1.243 1.243A6 6 0 0 1 12 8.485V10l2 2h1.172a2 2 0 0 1 1.414.586L18.5 14.5"/></svg>
            <span>Building</span>
        </a>
        <a href="{{ url_for('public.lectures') }}"
           class="nav-item {% if active == 'lectures' %}active{% endif %}">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg>
            <span>Lectures</span>
        </a>
        <a href="{{ url_for('public.cv') }}"
           class="nav-item {% if active == 'resume' %}active{% endif %}">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            <span>Resume</span>
        </a>
    </div>
</nav>

<main class="container">
    {% block content %}{% endblock %}
</main>

<footer class="footer">
    <p>&copy; {{ current_year }} {{ site.name }}.</p>
</footer>

<button class="scroll-top" id="scrollTop" title="Back to top">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
         stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px">
        <path d="m18 15-6-6-6 6"/>
    </svg>
</button>

<script>
(function () {
    /* Navbar hide on scroll-down */
    const nav = document.getElementById('navbar');
    let last = 0, ticking = false;
    window.addEventListener('scroll', function () {
        if (!ticking) {
            requestAnimationFrame(function () {
                const cur = window.scrollY;
                nav.classList.toggle('nav-hidden', cur > last && cur > 80);
                last = cur;
                ticking = false;
            });
            ticking = true;
        }
    });

    /* Scroll-to-top button */
    const btn = document.getElementById('scrollTop');
    window.addEventListener('scroll', function () {
        btn.classList.toggle('visible', window.scrollY > 300);
    });
    btn.addEventListener('click', function () {
        window.scrollTo({ top: 0, behavior: 'smooth' });
    });
})();
</script>

{% block extra_js %}{% endblock %}
</body>
</html>
